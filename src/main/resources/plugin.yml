name: Ascension
version: ${project.version}
main: com.ascension.core.bootstrap.AscensionPlugin
api-version: '1.20'
description: Production-oriented MMORPG tower progression plugin.
authors:
  - OpenAI Codex
softdepend:
  - PlaceholderAPI
  - LuckPerms
  - Vault
  - WorldEdit
  - WorldGuard
  - ProtocolLib
  - Citizens
  - MythicMobs
commands:
  asc:
    description: Ascension development and gameplay command root.
    usage: /asc <subcommand>
    permission: ascension.command
permissions:
  ascension.command:
    description: Allows use of Ascension commands.
    default: op
