name: Build

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ascension-phase9
          path: target/ascension-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
